version: '3.8'

services:
  # C Dilinde yazılan Core Veri Yapıları Motoru (API Sunucusu)
  c_backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dom_tree_core
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Ön Yüz (Frontend) - Nginx sunucusu
  frontend:
    image: nginx:alpine
    container_name: dom_tree_ui
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - c_backend
    restart: unless-stopped

  # Yapay Zeka (AI) Sentetik Veri Servisi
  ai_service:
    image: python:3.10-slim
    container_name: dom_tree_ai
    volumes:
      - ./ai_service:/app
    working_dir: /app
    command: python app.py
    ports:
      - "5001:5001"
    depends_on:
      - c_backend
    restart: unless-stopped
